-anchor="end">coordinating</text><text x="354" y="177" class="m" font-size="13.5" fill="#E9EEF5" font-weight="700">Research</text><rect x="440" y="167" width="220" height="10" rx="5" fill="#0B0F16" stroke="#222C3B"/><rect class="prog" x="440" y="167" width="180" height="10" rx="5" fill="#6CB8FF" style="animation-delay:-0.7s"/><text x="766" y="177" class="m" font-size="12" fill="#6CB8FF" text-anchor="end">running</text><text x="354" y="211" class="m" font-size="13.5" fill="#E9EEF5" font-weight="700">Analyse</text><rect x="440" y="201" width="220" height="10" rx="5" fill="#0B0F16" stroke="#222C3B"/><rect class="prog" x="440" y="201" width="121" height="10" rx="5" fill="#6CB8FF" style="animation-delay:-1.4s"/><text x="766" y="211" class="m" font-size="12" fill="#6CB8FF" text-anchor="end">running</text><text x="354" y="245" class="m" font-size="13.5" fill="#E9EEF5" font-weight="700">Review</text><rect x="440" y="235" width="220" height="10" rx="5" fill="#0B0F16" stroke="#222C3B"/><rect class="prog" x="440" y="235" width="44" height="10" rx="5" fill="#5D6A7D" style="animation-delay:-2.1s"/><text x="766" y="245" class="m" font-size="12" fill="#93A0B4" text-anchor="end">queued</text><rect x="352" y="278" width="416" height="184" rx="12" fill="#0B0F16" stroke="#FFB84D"/><text x="372" y="308" class="m" font-size="12" fill="#FFB84D" font-weight="700" letter-spacing="2">APPROVAL REQUIRED</text><text x="372" y="338" class="s" font-size="16.5" fill="#E9EEF5" font-weight="700">The coding agent wants to run a command</text><rect x="372" y="354" width="376" height="38" rx="8" fill="#111824" stroke="#2F3B4E"/><text x="386" y="378" class="m" font-size="14" fill="#E9EEF5">$ npm test</text><rect x="372" y="408" width="110" height="36" rx="8" fill="#161F2D" stroke="#2F3B4E"/><text x="427" y="431" class="s" font-size="14.5" fill="#93A0B4" text-anchor="middle" font-weight="600">Deny</text><rect class="appr" x="492" y="408" width="110" height="36" rx="8" fill="#161F2D" stroke="#2F3B4E"/><text x="547" y="431" class="s" font-size="14.5" fill="#E9EEF5" text-anchor="middle" font-weight="700">Approve</text><g class="apprt rm"><path d="M619.0 426.0l3.6 3.8l6.6 -7.6" fill="none" stroke="#4ADE9C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="638" y="431" class="m" font-size="12.5" fill="#4ADE9C">approved, running</text></g><rect x="802" y="80" width="370" height="400" rx="12" fill="#111824" stroke="#222C3B"/><text x="820" y="108" class="m" font-size="12.5" fill="#5D6A7D" letter-spacing="2">GATEWAY</text><rect x="820" y="132" width="106" height="34" rx="8" fill="#0B0F16" stroke="#2F3B4E"/><text x="873" y="154" class="m" font-size="12.5" fill="#E9EEF5" text-anchor="middle" letter-spacing="1">WEB</text><path d="M873 166C873 196 987.0 192 987.0 222" fill="none" stroke="#6CB8FF" stroke-width="1.5" class="flow"/><rect x="934" y="132" width="106" height="34" rx="8" fill="#0B0F16" stroke="#2F3B4E"/><text x="987" y="154" class="m" font-size="12.5" fill="#E9EEF5" text-anchor="middle" letter-spacing="1">MACOS</text><path d="M987 166C987 196 987.0 192 987.0 222" fill="none" stroke="#6CB8FF" stroke-width="1.5" class="flow"/><rect x="1048" y="132" width="106" height="34" rx="8" fill="#0B0F16" stroke="#2F3B4E"/><text x="1101" y="154" class="m" font-size="12.5" fill="#E9EEF5" text-anchor="middle" letter-spacing="1">WINDOWS</text><path d="M1101 166C1101 196 987.0 192 987.0 222" fill="none" stroke="#6CB8FF" stroke-width="1.5" class="flow"/><rect x="842" y="222" width="290" height="104" rx="12" fill="#161F2D" stroke="#4ADE9C" stroke-width="1.5"/><path d="M869.0 256v-5.0a7.0 7.0 0 0 1 14.0 0v5.0" fill="none" stroke="#4ADE9C" stroke-width="2"/><rect x="865.0" y="256" width="22.0" height="16.0" rx="3.5" fill="#4ADE9C"/><text x="904" y="260" class="s" font-size="17" fill="#E9EEF5" font-weight="800">Model gateway</text><text x="904" y="280" class="m" font-size="12.5" fill="#4ADE9C">provider keys stay here</text><text x="862" y="308" class="m" font-size="12" fill="#93A0B4">auth · routing · usage · memory · MCP</text><rect x="820" y="380" width="79" height="34" rx="8" fill="#0B0F16" stroke="#2F3B4E"/><text x="859.5" y="402" class="m" font-size="12" fill="#E9EEF5" text-anchor="middle">opencode</text><path d="M987.0 326C987.0 356 859.5 350 859.5 380" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow"/><rect x="905" y="380" width="79" height="34" rx="8" fill="#0B0F16" stroke="#2F3B4E"/><text x="944.5" y="402" class="m" font-size="12" fill="#E9EEF5" text-anchor="middle">openclaw</text><path d="M987.0 326C987.0 356 944.5 350 944.5 380" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow"/><rect x="990" y="380" width="79" height="34" rx="8" fill="#0B0F16" stroke="#2F3B4E"/><text x="1029.5" y="402" class="m" font-size="12" fill="#E9EEF5" text-anchor="middle">Chrome</text><path d="M987.0 326C987.0 356 1029.5 350 1029.5 380" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow"/><rect x="1075" y="380" width="79" height="34" rx="8" fill="#0B0F16" stroke="#2F3B4E"/><text x="1114.5" y="402" class="m" font-size="12" fill="#E9EEF5" text-anchor="middle">Ollama</text><path d="M987.0 326C987.0 356 1114.5 350 1114.5 380" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow"/><text x="987.0" y="444" class="m" font-size="12.5" fill="#93A0B4" text-anchor="middle">local runtimes, supervised by the app</text><text x="987.0" y="464" class="m" font-size="12" fill="#5D6A7D" text-anchor="middle">nothing in the demo recording is mocked</text><rect x="28" y="496" width="1144" height="94" rx="12" fill="#111824" stroke="#222C3B"/><text x="46" y="529" class="m" font-size="12.5" fill="#5D6A7D" letter-spacing="2">BOUNDARIES</text><g><rect x="167.0" y="510" width="230.0" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="177.0" y="528.125" class="m" font-size="12.5" fill="#E9EEF5">keys never leave the gateway</text></g><g><rect x="405.0" y="510" width="335.0" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="415.0" y="528.125" class="m" font-size="12.5" fill="#E9EEF5">file, shell and tool actions need approval</text></g><g><rect x="748.0" y="510" width="207.5" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="758.0" y="528.125" class="m" font-size="12.5" fill="#E9EEF5">model routing per surface</text></g><g><rect x="963.5" y="510" width="117.5" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="973.5" y="528.125" class="m" font-size="12.5" fill="#E9EEF5">shared memory</text></g><g><rect x="167.0" y="546" width="230.0" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="177.0" y="564.125" class="m" font-size="12.5" fill="#E9EEF5">MCP endpoint for other tools</text></g>
