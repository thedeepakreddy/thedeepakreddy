<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 618" width="1200" height="618" role="img" aria-label="Aira: a full-stack AI workspace across web, macOS and Windows. Surfaces: Chat, Code, Agents, Browser, Workspace. An agent fleet with roles; commands and file changes wait for approval. Web and Tauri desktop shells connect to a server-side model gateway that holds provider keys and supervises local runtimes: opencode, openclaw, Chrome, Ollama.">
<title>Aira: a full-stack AI workspace across web, macOS and Windows. Surfaces: Chat, Code, Agents, Browser, Workspace. An agent fleet with roles; commands and file changes wait for approval. Web and Tauri desktop shells connect to a server-side model gateway that holds provider keys and supervises local runtimes: opencode, openclaw, Chrome, Ollama.</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1A2331"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#080B11"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="618" rx="18"/></clipPath>
</defs>
<style>
.m{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes sf{0%{opacity:0;}1.600%{opacity:1;}18.400%{opacity:1;}20.000%{opacity:0;}100%{opacity:0;}}.sf{opacity:0;animation:sf 9.00s linear infinite}@keyframes prog{0%{transform:scaleX(.04)}80%,100%{transform:scaleX(1)}}.prog{transform-box:fill-box;transform-origin:left;animation:prog 6s ease-in-out infinite}@keyframes appr{0%,45%{fill:#161F2D;stroke:#2F3B4E}52%,92%{fill:#14402E;stroke:#4ADE9C}100%{fill:#161F2D;stroke:#2F3B4E}}.appr{animation:appr 6s linear infinite}@keyframes apprt{0%,52%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}.apprt{animation:apprt 6s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}}</style>
<g clip-path="url(#frame)">
<rect width="1200" height="618" fill="url(#bg)"/>
<rect width="1200" height="618" fill="url(#grid)"/>
<rect width="1200" height="56" fill="#111824"/><line x1="0" y1="56" x2="1200" y2="56" stroke="#222C3B"/><circle cx="34" cy="28" r="6.5" fill="#FF6B6B" opacity=".85"/><circle cx="56" cy="28" r="6.5" fill="#FFB84D" opacity=".85"/><circle cx="78" cy="28" r="6.5" fill="#4ADE9C" opacity=".85"/><text x="112" y="33" class="m" font-size="16" fill="#E9EEF5" font-weight="700">aira</text><text x="160.0" y="33" class="m" font-size="15" fill="#93A0B4">— one AI workspace across web, macOS and Windows</text><circle class="pulse" cx="1032" cy="28" r="5" fill="#4ADE9C"/><text x="1164" y="33" class="m" font-size="14" fill="#4ADE9C" text-anchor="end">v0.1.0 · macOS</text><rect x="28" y="80" width="290" height="400" rx="12" fill="#111824" stroke="#222C3B"/><text x="46" y="108" class="m" font-size="12.5" fill="#5D6A7D" letter-spacing="2">SURFACES</text><g class="sf" style="animation-delay:0.0s"><rect x="38" y="126" width="270" height="60" rx="9" fill="#4ADE9C" fill-opacity=".1" stroke="#4ADE9C" stroke-opacity=".55"/><rect x="38" y="136" width="3" height="40" rx="1.5" fill="#4ADE9C"/></g><text x="54" y="149" class="m" font-size="12.5" fill="#5D6A7D">01</text><text x="84" y="149" class="s" font-size="15.5" fill="#E9EEF5" font-weight="700">Chat</text><text x="84" y="167" class="m" font-size="12" fill="#93A0B4">streams; names the model used</text><g class="sf rm" style="animation-delay:1.8s"><rect x="38" y="194" width="270" height="60" rx="9" fill="#4ADE9C" fill-opacity=".1" stroke="#4ADE9C" stroke-opacity=".55"/><rect x="38" y="204" width="3" height="40" rx="1.5" fill="#4ADE9C"/></g><text x="54" y="217" class="m" font-size="12.5" fill="#5D6A7D">02</text><text x="84" y="217" class="s" font-size="15.5" fill="#E9EEF5" font-weight="700">Code</text><text x="84" y="235" class="m" font-size="12" fill="#93A0B4">changes wait for approval</text><g class="sf" style="animation-delay:3.6s"><rect x="38" y="262" width="270" height="60" rx="9" fill="#4ADE9C" fill-opacity=".1" stroke="#4ADE9C" stroke-opaci