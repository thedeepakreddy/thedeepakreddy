<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="CosmOS: a modular intelligence infrastructure platform. Products such as Aira and Echo connect to one coordination layer, Cosmos Core, which coordinates ToolOS (can do), AgentOS (organize work), ResearchOS (investigate) and EvalOS (judge quality). MemoryOS and ModelOS are planned as extractions from ResearchOS.">
<title>CosmOS: a modular intelligence infrastructure platform. Products such as Aira and Echo connect to one coordination layer, Cosmos Core, which coordinates ToolOS (can do), AgentOS (organize work), ResearchOS (investigate) and EvalOS (judge quality). MemoryOS and ModelOS are planned as extractions from ResearchOS.</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1A2331"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#080B11"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="500" rx="18"/></clipPath>
</defs>
<style>
.m{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}}</style>
<g clip-path="url(#frame)">
<rect width="1200" height="500" fill="url(#bg)"/>
<rect width="1200" height="500" fill="url(#grid)"/>
<rect width="1200" height="56" fill="#111824"/><line x1="0" y1="56" x2="1200" y2="56" stroke="#222C3B"/><circle cx="34" cy="28" r="6.5" fill="#FF6B6B" opacity=".85"/><circle cx="56" cy="28" r="6.5" fill="#FFB84D" opacity=".85"/><circle cx="78" cy="28" r="6.5" fill="#4ADE9C" opacity=".85"/><text x="112" y="33" class="m" font-size="16" fill="#E9EEF5" font-weight="700">cosmos</text><text x="179.2" y="33" class="m" font-size="15" fill="#93A0B4">— modular intelligence infrastructure</text><circle class="pulse" cx="1074" cy="28" r="5" fill="#4ADE9C"/><text x="1164" y="33" class="m" font-size="14" fill="#4ADE9C" text-anchor="end">site live</text><text x="600" y="96" class="m" font-size="12" fill="#5D6A7D" text-anchor="middle" letter-spacing="2">PRODUCTS THAT SHOULD NOT REBUILD THE SAME THING</text><rect x="393" y="112" width="55" height="30" rx="15" fill="#111824" stroke="#2F3B4E"/><text x="404.7" y="132" class="m" font-size="13" fill="#E9EEF5">Aira</text><path d="M420 142C420 180 600 176 600 214" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow" opacity=".7"/><rect x="458" y="112" width="55" height="30" rx="15" fill="#111824" stroke="#2F3B4E"/><text x="469.9" y="132" class="m" font-size="13" fill="#E9EEF5">Echo</text><path d="M486 142C486 180 600 176 600 214" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow" opacity=".7"/><rect x="523" y="112" width="141" height="30" rx="15" fill="#111824" stroke="#2F3B4E"/><text x="535.1" y="132" class="m" font-size="13" fill="#E9EEF5">enterprise apps</text><path d="M594 142C594 180 600 176 600 214" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow" opacity=".7"/><rect x="674" y="112" width="133" height="30" rx="15" fill="#111824" stroke="#2F3B4E"/><text x="686.1" y="132" class="m" font-size="13" fill="#E9EEF5">research tools</text><path d="M741 142C741 180 600 176 600 214" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow" opacity=".7"/><rect x="40" y="164" width="392" height="84" rx="12" fill="#111824" stroke="#2F3B4E"/><text x="60" y="190" class="m" font-size="12" fill="#4ADE9C" font-weight="700" letter-spacing="2">CAN DO</text><text x="59" y="216" class="s" font-size="23" fill="#E9EEF5" font-weight="800" letter-spacing="-0.4">ToolOS</text><text x="60" y="235" class="m" font-size="12" fill="#93A0B4">the safe doorway to capabilities</text><g><rect x="356.6" y="178" width="57.4" height="26.5" rx="13.25" fill="#0B0F16" stroke="#4ADE9C"/><text x="364.6" y="195.275" class="m" font-size="11.5" fill="#4ADE9C">v1.0.0</text></g><path d="M432 206.0C451.0 206.0 451.0 250.0 470 250.0" fill="none" stroke="#4ADE9C" stroke-width="1.6" class="flow"/><rect x="40" y="264" width="392" height="84" rx="12" fill="#111824" stroke="#2F3B4E"/><text x="60" y="290" class="m" font-size="12" fill="#4ADE9C" font-weight="700" letter-spacing="2">ORGANIZE WORK</text><text x="59" y="316" class="s" font-size="23" fill="#E9EEF5" font-weight="800" letter-spacing="-0.4">AgentOS</text><text x="60" y="335" class="m" font-size="12" fill="#93A0B4">TypeScript · Fastify · SQLite</text><g><rect x="356.6" y="278" width="57.4" height="26.5" rx="13.25" fill="#0B0F16" stroke="#4ADE9C"/><text x="364.6" y="295.275" class="m" font-size="11.5" fill="#4ADE9C">v0.2.0</text></g><path d="M432 306.0C451.0 306.0 451.0 276.0 470 276.0" fill="none" stroke="#4ADE9C" stroke-width="1.6" class="flow"/><rect x="40" y="364" width="392" height="84" rx="12" fill="#111824" stroke="#2F3B4E"/><text x="60" y="390" class="m" font-size="12" fill="#4ADE9C" font-weight="700" letter-spacing="2">INVESTIGATE</text><text x="59" y="416" class="s" font-size="23" fill="#E9EEF5" font-weight="800" letter-spacing="-0.4">ResearchOS</text><text x="60" y="435" class="m" font-size="12" fill="#93A0B4">the most mature system in Cosmos</text><g><rect x="356.6" y="378" width="57.4" height="26.5" rx="13.25" fill="#0B0F16" stroke="#4ADE9C"/><text x="364.6" y="395.275" class="m" font-size="11.5" fill="#4ADE9C">mature</text></g><path d="M432 406.0C451.0 406.0 451.0 302.0 470 302.0" fill="none" stroke="#4ADE9C" stroke-width="1.6" class="flow"/><rect x="768" y="164" width="392" height="84" rx="12" fill="#111824" stroke="#2F3B4E"/><text x="788" y="190" class="m" font-size="12" fill="#4ADE9C" font-weight="700" letter-spacing="2">JUDGE QUALITY</text><text x="787" y="216" class="s" font-size="23" fill="#E9EEF5" font-weight="800" letter-spacing="-0.4">EvalOS</text><text x="788" y="235" class="m" font-size="12" fill="#93A0B4">TypeScript · Fastify · SQLite</text><g><rect x="1091.5" y="178" width="50.5" height="26.5" rx="13.25" fill="#0B0F16" stroke="#4ADE9C"/><text x="1099.5" y="195.275" class="m" font-size="11.5" fill="#4ADE9C">built</text></g><path d="M768 206.0C749.0 206.0 749.0 250.0 730 250.0" fill="none" stroke="#4ADE9C" stroke-width="1.6" class="flow"/><rect x="768" y="264" width="392" height="84" rx="12" fill="#111824" stroke="#5D6A7D" stroke-dasharray="5 5"/><text x="788" y="290" class="m" font-size="12" fill="#5D6A7D" font-weight="700" letter-spacing="2">PLANNED</text><text x="787" y="316" class="s" font-size="23" fill="#93A0B4" font-weight="800" letter-spacing="-0.4">MemoryOS</text><text x="788" y="335" class="m" font-size="12" fill="#5D6A7D">extracted from ResearchOS, behind its port</text><g><rect x="1077.7" y="278" width="64.3" height="26.5" rx="13.25" fill="#0B0F16" stroke="#5D6A7D"/><text x="1085.7" y="295.275" class="m" font-size="11.5" fill="#5D6A7D">planned</text></g><path d="M768 306.0C749.0 306.0 749.0 276.0 730 276.0" fill="none" stroke="#5D6A7D" stroke-width="1.4" stroke-dasharray="3 6"/><rect x="768" y="364" width="392" height="84" rx="12" fill="#111824" stroke="#5D6A7D" stroke-dasharray="5 5"/><text x="788" y="390" class="m" font-size="12" fill="#5D6A7D" font-weight="700" letter-spacing="2">PLANNED</text><text x="787" y="416" class="s" font-size="23" fill="#93A0B4" font-weight="800" letter-spacing="-0.4">ModelOS</text><text x="788" y="435" class="m" font-size="12" fill="#5D6A7D">router with retry, fallback, circuit breaking</text><g><rect x="1077.7" y="378" width="64.3" height="26.5" rx="13.25" fill="#0B0F16" stroke="#5D6A7D"/><text x="1085.7" y="395.275" class="m" font-size="11.5" fill="#5D6A7D">planned</text></g><path d="M768 406.0C749.0 406.0 749.0 302.0 730 302.0" fill="none" stroke="#5D6A7D" stroke-width="1.4" stroke-dasharray="3 6"/><rect class="pulse" x="462" y="206" width="276" height="140" rx="20" fill="none" stroke="#4ADE9C" stroke-opacity=".3"/><rect x="470" y="214" width="260" height="124" rx="14" fill="#161F2D" stroke="#4ADE9C" stroke-width="1.5"/><text x="600" y="252" class="m" font-size="13" fill="#4ADE9C" text-anchor="middle" font-weight="700" letter-spacing="2.6">COSMOS CORE</text><text x="600" y="284" class="s" font-size="20" fill="#E9EEF5" text-anchor="middle" font-weight="800">one coordination layer</text><text x="600" y="310" class="m" font-size="12.5" fill="#93A0B4" text-anchor="middle">clear boundaries, thin centre</text><text x="600" y="478" class="m" font-size="13.5" fill="#93A0B4" text-anchor="middle">the test: would two unrelated products both need this?</text>
</g>
<rect x=".5" y=".5" width="1199" height="499" rx="17.5" fill="none" stroke="#222C3B"/>
</svg>
