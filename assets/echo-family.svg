<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 326" width="1200" height="326" role="img" aria-label="Echo ecosystem: Echo Phone, a standalone phone assistant with an optional relay to Echo on your Mac; Echo Mac, the local-first agent runtime; and Echo Online, a Chrome extension with tab-scoped agents, four-tier local-first routing and an MCP bridge to Claude Desktop and Claude Code.">
<title>Echo ecosystem: Echo Phone, a standalone phone assistant with an optional relay to Echo on your Mac; Echo Mac, the local-first agent runtime; and Echo Online, a Chrome extension with tab-scoped agents, four-tier local-first routing and an MCP bridge to Claude Desktop and Claude Code.</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1A2331"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#080B11"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="326" rx="18"/></clipPath>
</defs>
<style>
.m{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes tier{0%{opacity:0;}2.500%{opacity:1;}22.500%{opacity:1;}25.000%{opacity:0;}100%{opacity:0;}}.tier{opacity:0;animation:tier 6.00s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}}</style>
<g clip-path="url(#frame)">
<rect width="1200" height="326" fill="url(#bg)"/>
<rect width="1200" height="326" fill="url(#grid)"/>
<text x="56" y="58" class="m" font-size="14" fill="#93A0B4" letter-spacing="2.6">ECHO ECOSYSTEM</text><text x="1144" y="58" class="m" font-size="14" fill="#5D6A7D" text-anchor="end">one agent, three surfaces</text><rect x="56" y="86" width="320" height="196" rx="14" fill="#111824" stroke="#2F3B4E"/><text x="78" y="120" class="m" font-size="12.5" fill="#93A0B4" letter-spacing="2">PHONE</text><rect x="286" y="103" width="70" height="26" rx="13" fill="#0B0F16" stroke="#4ADE9C"/><circle class="pulse" cx="303" cy="116" r="4" fill="#4ADE9C"/><text x="314" y="121" class="m" font-size="12.5" fill="#4ADE9C" font-weight="700" letter-spacing="1.5">LIVE</text><text x="77" y="158" class="s" font-size="28" fill="#E9EEF5" font-weight="800" letter-spacing="-0.6">Echo Phone</text><text x="78" y="184" class="m" font-size="13.5" fill="#93A0B4">standalone assistant</text><text x="78" y="204" class="m" font-size="13.5" fill="#93A0B4">optional relay to Echo on your Mac</text><g><rect x="78" y="230" width="57.5" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="88" y="248.125" class="m" font-size="12.5" fill="#E9EEF5">Today</text></g><g><rect x="142.5" y="230" width="50.0" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="152.5" y="248.125" class="m" font-size="12.5" fill="#E9EEF5">Bots</text></g><g><rect x="199.5" y="230" width="80.0" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="209.5" y="248.125" class="m" font-size="12.5" fill="#E9EEF5">Briefing</text></g><g><rect x="286.5" y="230" width="57.5" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="296.5" y="248.125" class="m" font-size="12.5" fill="#E9EEF5">Brain</text></g><rect x="440" y="86" width="320" height="196" rx="14" fill="#111824" stroke="#4ADE9C"/><text x="462" y="120" class="m" font-size="12.5" fill="#93A0B4" letter-spacing="2">MAC · FLAGSHIP</text><text x="461" y="158" class="s" font-size="28" fill="#E9EEF5" font-weight="800" letter-spacing="-0.6">Echo Mac</text><text x="462" y="184" class="m" font-size="13.5" fill="#93A0B4">local-first agent runtime</text><text x="462" y="204" class="m" font-size="13.5" fill="#93A0B4">sees, acts, verifies on the desktop</text><g><rect x="462" y="230" width="80.0" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="472" y="248.125" class="m" font-size="12.5" fill="#E9EEF5">perceive</text></g><line x1="542" y1="243.5" x2="558" y2="243.5" stroke="#4ADE9C" stroke-width="1.8" class="flow"/><g><rect x="558.0" y="230" width="42.5" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><text x="568.0" y="248.125" class="m" font-size="12.5" fill="#E9EEF5">act</text></g><line x1="600" y1="243.5" x2="616" y2="243.5" stroke="#4ADE9C" stroke-width="1.8" class="flow"/><g><rect x="616.5" y="230" width="65.0" height="27.5" rx="13.75" fill="#0B0F16" stroke="#4ADE9C"/><text x="626.5" y="248.125" class="m" font-size="12.5" fill="#4ADE9C">verify</text></g><rect x="824" y="86" width="320" height="196" rx="14" fill="#111824" stroke="#2F3B4E"/><text x="846" y="120" class="m" font-size="12.5" fill="#93A0B4" letter-spacing="2">CHROME MV3</text><text x="845" y="158" class="s" font-size="28" fill="#E9EEF5" font-weight="800" letter-spacing="-0.6">Echo Online</text><text x="846" y="184" class="m" font-size="13.5" fill="#93A0B4">tab agents with approval gates</text><text x="846" y="204" class="m" font-size="13.5" fill="#93A0B4">MCP bridge to Claude Desktop/Code</text><rect x="846" y="230" width="70" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><rect class="tier rm" x="846" y="230" width="70" height="27.5" rx="13.75" fill="#12261E" stroke="#4ADE9C" style="animation-delay:0.0s"/><text x="855" y="248.4" class="m" font-size="12.5" fill="#E9EEF5">instant</text><rect x="922" y="230" width="63" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><rect class="tier" x="922" y="230" width="63" height="27.5" rx="13.75" fill="#12261E" stroke="#4ADE9C" style="animation-delay:1.5s"/><text x="931.5" y="248.4" class="m" font-size="12.5" fill="#E9EEF5">cached</text><rect x="992" y="230" width="63" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><rect class="tier" x="992" y="230" width="63" height="27.5" rx="13.75" fill="#12261E" stroke="#4ADE9C" style="animation-delay:3.0s"/><text x="1000.5" y="248.4" class="m" font-size="12.5" fill="#E9EEF5">device</text><rect x="1060" y="230" width="56" height="27.5" rx="13.75" fill="#0B0F16" stroke="#2F3B4E"/><rect class="tier" x="1060" y="230" width="56" height="27.5" rx="13.75" fill="#12261E" stroke="#4ADE9C" style="animation-delay:4.5s"/><text x="1069.5" y="248.4" class="m" font-size="12.5" fill="#E9EEF5">cloud</text><line x1="376" y1="184.0" x2="440" y2="184.0" stroke="#4ADE9C" stroke-width="1.8" class="flow"/><rect x="383.0" y="173.0" width="50.0" height="22" rx="11" fill="#0B0F16" stroke="#2F3B4E"/><text x="408.0" y="188.3" class="m" font-size="12" fill="#E9EEF5" text-anchor="middle">relay</text><text x="56" y="309" class="m" font-size="13" fill="#5D6A7D">Your Mac never opens a port: Echo holds outgoing requests to the relay.</text><text x="1144" y="309" class="m" font-size="13" fill="#5D6A7D" text-anchor="end">four-tier routing tries local before cloud</text>
</g>
<rect x=".5" y=".5" width="1199" height="325" rx="17.5" fill="none" stroke="#222C3B"/>
</svg>
