<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Design principle: probabilistic reasoning with deterministic execution boundaries. AI interprets intent, retrieves evidence and selects tools; typed tools, permissions and safety policy form the gate; authoritative systems compute results and verification decides success.">
