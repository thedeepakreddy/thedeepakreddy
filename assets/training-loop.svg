<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Agent training loop: frontier-model teacher, Echo observations and tool calls, filter label and verify trajectories, synthetic plus real dataset, Qwen 2.5-VL fine-tuning with GRPO, local multimodal agent, then new verified trajectories and evaluation feed back into the loop.">
<title>Agent training loop: frontier-model teacher, Echo observations and tool calls, filter label and verify trajectories, synthetic plus real dataset, Qwen 2.5-VL fine-tuning with GRPO, local multimodal agent, then new verified trajectories and evaluation feed back into the loop.</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1A2331"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#080B11"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="330" rx="18"/></clipPath>
</defs>
<style>
.m{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}}</style>
<g clip-path="url(#frame)">
<rect width="1200" height="330" fill="url(#bg)"/>
<rect width="1200" height="330" fill="url(#grid)"/>
<text x="60" y="58" class="m" font-size="14" fill="#93A0B4" letter-spacing="2.6">AGENT TRAINING LOOP</text><text x="1140" y="58" class="m" font-size="14" fill="#5D6A7D" text-anchor="end">distilling reliable computer use into a local model</text><rect x="50" y="104" width="164" height="84" rx="12" fill="#111824" stroke="#2F3B4E"/><text x="66" y="130" class="m" font-size="12" fill="#5D6A7D">01</text><text x="66" y="154" class="s" font-size="17" fill="#E9EEF5" font-weight="700">Frontier</text><text x="66" y="174" class="m" font-size="12.5" fill="#93A0B4">teacher</text><line x1="214" y1="146.0" x2="237" y2="146.0" stroke="#4ADE9C" stroke-width="2" class="flow"/><rect x="237" y="104" width="164" height="84" rx="12" fill="#111824" stroke="#2F3B4E"/><text x="253" y="130" class="m" font-size="12" fill="#5D6A7D">02</text><text x="253" y="154" class="s" font-size="17" fill="#E9EEF5" font-weight="700">Echo</text><text x="253" y="174" class="m" font-size="12.5" fill="#93A0B4">trajectories</text><line x1="401" y1="146.0" x2="424" y2="146.0" stroke="#4ADE9C" stroke-width="2" class="flow"/><rect x="424" y="104" width="164" height="84" rx="12" fill="#111824" stroke="#4ADE9C"/><text x="440" y="130" class="m" font-size="12" fill="#5D6A7D">03</text><text x="440" y="154" class="s" font-size="17" fill="#E9EEF5" font-weight="700">Filter · label</text><text x="440" y="174" class="m" font-size="12.5" fill="#4ADE9C">verify</text><line x1="588" y1="146.0" x2="611" y2="146.0" stroke="#4ADE9C" stroke-width="2" class="flow"/><rect x="611" y="104" width="164" height="84" rx="12" fill="#111824" stroke="#2F3B4E"/><text x="627" y="130" class="m" font-size="12" fill="#5D6A7D">04</text><text x="627" y="154" class="s" font-size="17" fill="#E9EEF5" font-weight="700">Synthetic + real</text><text x="627" y="174" class="m" font-size="12.5" fill="#93A0B4">dataset</text><line x1="775" y1="146.0" x2="798" y2="146.0" stroke="#4ADE9C" stroke-width="2" class="flow"/><rect x="798" y="104" width="164" height="84" rx="12" fill="#111824" stroke="#FFB84D"/><text x="814" y="130" class="m" font-size="12" fill="#5D6A7D">05</text><text x="814" y="154" class="s" font-size="17" fill="#E9EEF5" font-weight="700">Qwen 2.5-VL</text><text x="814" y="174" class="m" font-size="12.5" fill="#FFB84D">GRPO fine-tune</text><line x1="962" y1="146.0" x2="985" y2="146.0" stroke="#4ADE9C" stroke-width="2" class="flow"/><rect x="985" y="104" width="164" height="84" rx="12" fill="#111824" stroke="#4ADE9C"/><text x="1001" y="130" class="m" font-size="12" fill="#5D6A7D">06</text><text x="1001" y="154" class="s" font-size="17" fill="#E9EEF5" font-weight="700">Local</text><text x="1001" y="174" class="m" font-size="12.5" fill="#4ADE9C">multimodal agent</text><path d="M1067.0 188V232Q1067.0 252 1047.0 252H152.0Q132.0 252 132.0 232V196" fill="none" stroke="#2F3B4E" stroke-width="1.5"/><path d="M1067.0 188V232Q1067.0 252 1047.0 252H152.0Q132.0 252 132.0 232V196" fill="none" stroke="#4ADE9C" stroke-width="1.5" class="flow" opacity=".7"/><path d="M126.0 203L132.0 194L138.0 203" fill="none" stroke="#4ADE9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle r="4.5" fill="#4ADE9C"><animateMotion dur="7s" begin="-0.00s" repeatCount="indefinite" path="M1067.0 188V232Q1067.0 252 1047.0 252H152.0Q132.0 252 132.0 232V196"/></circle><circle r="4.5" fill="#4ADE9C"><animateMotion dur="7s" begin="-2.33s" repeatCount="indefinite" path="M1067.0 188V232Q1067.0 252 1047.0 252H152.0Q132.0 252 132.0 232V196"/></circle><circle r="4.5" fill="#4ADE9C"><animateMotion dur="7s" begin="-4.66s" repeatCount="indefinite" path="M1067.0 188V232Q1067.0 252 1047.0 252H152.0Q132.0 252 132.0 232V196"/></circle><rect x="432.1" y="238" width="335.8" height="28" rx="14" fill="#0B0F16" stroke="#2F3B4E"/><text x="600" y="257" class="m" font-size="13.5" fill="#E9EEF5" text-anchor="middle">new verified trajectories + evaluation</text>
</g>
<rect x=".5" y=".5" width="1199" height="329" rx="17.5" fill="none" stroke="#222C3B"/>
</svg>
