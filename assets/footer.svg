<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Status: available. Building agents that have to be right? Let&#x27;s connect.">
<title>Status: available. Building agents that have to be right? Let&#x27;s connect.</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1A2331"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#080B11"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="250" rx="18"/></clipPath>
<linearGradient id="fx" x1="0" x2="1"><stop offset="0" stop-color="#4ADE9C" stop-opacity="0"/><stop offset=".5" stop-color="#4ADE9C" stop-opacity=".1"/><stop offset="1" stop-color="#4ADE9C" stop-opacity="0"/></linearGradient></defs>
<style>
.m{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes scanx{0%{transform:translateX(-200px)}100%{transform:translateX(1300px)}}.scanx{animation:scanx 6s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}}</style>
<g clip-path="url(#frame)">
<rect width="1200" height="250" fill="url(#bg)"/>
<rect width="1200" height="250" fill="url(#grid)"/>
<rect class="scanx" x="0" y="0" width="200" height="250" fill="url(#fx)"/><circle class="pulse" cx="66" cy="57" r="5" fill="#4ADE9C"/><text x="82" y="62" class="m" font-size="14" fill="#4ADE9C" letter-spacing="2.6">STATUS: AVAILABLE</text><text x="56" y="128" class="s" font-size="48" fill="#E9EEF5" font-weight="800" letter-spacing="-1.4">Building agents that have to be right?</text><text x="58" y="172" class="s" font-size="21" fill="#93A0B4">Reliable AI products, autonomous agents, data platforms, decision systems.</text><text x="58" y="216" class="m" font-size="16" fill="#4ADE9C">$ connect --with deepak</text><rect x="288" y="201" width="9" height="19" fill="#4ADE9C" style="animation:blink 1s steps(1) infinite"/>
</g>
<rect x=".5" y=".5" width="1199" height="249" rx="17.5" fill="none" stroke="#222C3B"/>
</svg>
