<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 538" width="1200" height="538" role="img" aria-label="Target roles. Primary: Forward Deployed AI Engineer. Also: AI Software Engineer, Agentic AI Engineer, Applied AI Engineer, Multimodal AI Engineer, AI Product Engineer, Computer-Use Agent Engineer, LLM / Agent Platform Engineer, AI Automation Engineer, Research Engineer, Agent Systems, Data Scientist / ML Engineer, BI &amp; Decision Science. Education: BSc Computer Science Engineering and MSc Business Data Analytics.">
<title>Target roles. Primary: Forward Deployed AI Engineer. Also: AI Software Engineer, Agentic AI Engineer, Applied AI Engineer, Multimodal AI Engineer, AI Product Engineer, Computer-Use Agent Engineer, LLM / Agent Platform Engineer, AI Automation Engineer, Research Engineer, Agent Systems, Data Scientist / ML Engineer, BI &amp; Decision Science. Education: BSc Computer Science Engineering and MSc Business Data Analytics.</title>
<defs>
