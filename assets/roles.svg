@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes lock{0%,7.73%{opacity:1}9.09%,100%{opacity:0}}.lock{opacity:0;animation:lock 15.4s linear infinite}@keyframes corner{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}.corner{transform-box:fill-box;transform-origin:center;animation:corner 2.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}}</style>
