<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 658" width="1200" height="658" role="img" aria-label="SYNTRA: an autonomous multi-agent software engineering platform. Seven layers from control plane to verification. Planning roles produce a PRD, ADR and task DAG; sandboxed engineers produce diffs; QA, security and code review verify independently; every handoff is a SHA-256 hashed artifact; a human delivery gate controls release.">
<title>SYNTRA: an autonomous multi-agent software engineering platform. Seven layers from control plane to verification. Planning roles produce a PRD, ADR and task DAG; sandboxed engineers produce diffs; QA, security and code review verify independently; every handoff is a SHA-256 hashed artifact; a human delivery gate controls release.</title>
