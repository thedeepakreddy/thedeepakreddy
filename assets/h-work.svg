<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" width="1200" height="72" role="img" aria-label="04 More products: built around real people">
<title>04 More products: built around real people</title>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1A2331"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#080B11"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="72" rx="14"/></clipPath>
</defs>
<style>
.m{font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm{opacity:1!important}}</style>
<g clip-path="url(#frame)">
<rect width="1200" height="72" fill="url(#bg)"/>
<rect width="1200" height="72" fill="url(#grid)"/>
<text x="34" y="46" class="m" font-size="20" fill="#4ADE9C" font-weight="700">04</text><line x1="74" y1="22" x2="74" y2="50" stroke="#2F3B4E" stroke-width="1.5"/><text x="92" y="47" class="s" font-size="28" fill="#E9EEF5" font-weight="800" letter-spacing="-0.5">More products</text><line x1="334" y1="37" x2="942" y2="37" stroke="#2F3B4E" stroke-dasharray="2 8" class="flow"/><text x="1166" y="42" class="m" font-size="14" fill="#93A0B4" text-anchor="end">built around real people</text>
</g>
<rect x=".5" y=".5" width="1199" height="71" rx="13.5" fill="none" stroke="#222C3B"/>
</svg>
