<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Animated analytics pipeline: raw data to SQL and ETL to machine learning to dashboards and decisions">
  <defs>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#0e4429"/>
    </linearGradient>
    <linearGradient id="finalFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" x2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#3fb950"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="450" y="26" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,sans-serif" font-size="16" font-weight="700" fill="url(#titleFill)" letter-spacing="3">
    HOW I TURN RAW DATA INTO DECISIONS
  </text>

  <g stroke="#238636" stroke-width="2" stroke-dasharray="6 5" opacity="0.55">
    <line x1="185" y1="105" x2="255" y2="105"/>
    <line x1="415" y1="105" x2="485" y2="105"/>
    <line x1="645" y1="105" x2="715" y2="105"/>
  </g>

  <g fill="#7ee787" filter="url(#glow)">
    <circle cy="105" r="4"><animate attributeName="cx" values="185;255" dur="1.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cy="105" r="4"><animate attributeName="cx" values="415;485" dur="1.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cy="105" r="4"><animate attributeName="cx" values="645;715" dur="1.6s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Segoe UI',Ubuntu,Helvetica,sans-serif" text-anchor="middle">
    <g>
      <rect x="25" y="70" width="160" height="70" rx="12" fill="url(#nodeFill)" stroke="#3fb950" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="105" y="100" font-size="15" font-weight="700" fill="#ffffff">INGEST</text>
      <text x="105" y="122" font-size="11.5" fill="#a5f3b4">APIs · SQL · Scrapers</text>
    </g>
    <g>
      <rect x="255" y="70" width="160" height="70" rx="12" fill="url(#nodeFill)" stroke="#3fb950" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <text x="335" y="100" font-size="15" font-weight="700" fill="#ffffff">ENGINEER</text>
      <text x="335" y="122" font-size="11.5" fill="#a5f3b4">ETL · Features · QA</text>
    </g>
    <g>
      <rect x="485" y="70" width="160" height="70" rx="12" fill="url(#nodeFill)" stroke="#3fb950" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <text x="565" y="100" font-size="15" font-weight="700" fill="#ffffff">MODEL</text>
      <text x="565" y="122" font-size="11.5" fill="#a5f3b4">ML · Forecast · SHAP</text>
    </g>
    <g>
      <rect x="715" y="70" width="160" height="70" rx="12" fill="url(#finalFill)" stroke="#7ee787" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="795" y="100" font-size="15" font-weight="700" fill="#ffffff">DECIDE</text>
      <text x="795" y="122" font-size="11.5" fill="#dcffe4">Tableau · Apps · ROI</text>
    </g>
  </g>

  <text x="450" y="176" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,sans-serif" font-size="12.5" fill="#8b949e">
    every project below ships the whole chain &#8212; not just the notebook
  </text>
</svg>
